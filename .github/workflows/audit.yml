name: audit

# Each day this workflow builds main with m2 build, runs the full audit with m2 audit, and writes the report into reports/audit/ (spec 15). A change to main needs a pull request, thus the workflow opens one when the report changes. The branch agent/audit/report has the newest report, and the workflow writes over it on each run.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit
  cancel-in-progress: false

# With shell bash, a step fails when a command in a pipe fails.
defaults:
  run:
    shell: bash

jobs:
  audit:
    name: full audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Push the branch agent/audit/report.
      contents: write
      # Open the pull request.
      pull-requests: write
      # Run the check workflow on the branch. A push with the workflow token does not start a workflow.
      actions: write
    steps:
      # Rule T01 reads the git history, so the clone is not shallow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/m2
      - uses: ./.github/actions/lean
      - name: m2 build
        run: m2 build
      - name: m2 audit
        id: audit
        run: |
          code=0
          m2 audit -q || code=$?
          echo "failed=$([ "$code" = 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            cat reports/audit/all.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$(git status --porcelain -uall -- reports/audit/)" ]; then
            echo "The report in reports/audit/ did not change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c agent/audit/report
          git add -- reports/audit/
          git commit -q -m "Write the audit report of ${SHA:0:12}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force origin HEAD:refs/heads/agent/audit/report
          url=$(gh pr list --repo "$REPO" --head agent/audit/report --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            {
              echo "The workflow audit ran the full audit on main and wrote the new report into \`reports/audit/\`. The workflow writes over this branch on each run, thus this pull request has the newest report."
              echo
              echo '```'
              sed -n '/^rule /,$p' reports/audit/all.txt
              echo '```'
            } > "$RUNNER_TEMP/body.md"
            url=$(gh pr create --repo "$REPO" --base main --head agent/audit/report --title "Write the audit report" --body-file "$RUNNER_TEMP/body.md" --label "type: chore")
          fi
          gh workflow run check.yml --repo "$REPO" --ref agent/audit/report
          echo "The report changed. The pull request is $url." >> "$GITHUB_STEP_SUMMARY"
      # The report goes into the pull request also when a rule fails. Then this step makes the run fail, so that the failure is visible.
      - name: the result of the audit
        if: steps.audit.outputs.failed == 'true'
        run: |
          echo "::error::A rule of the full audit fails on main. The summary of this run has the report."
          exit 1
