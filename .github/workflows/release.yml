name: release

# This workflow cuts the monthly release of math2 with m2 release cut (spec 06.2). A release takes two runs of the workflow and one pull request:
#
# 1. The step cut builds main, writes the manifest, the levels and the notes of the release, and opens the pull request release/NAME with them. The job verify then rebuilds the release on a second runner with m2 release verify, and adds the rebuild check to the pull request.
# 2. A person writes the summary of the notes in the pull request and merges it.
# 3. The step tag runs the full audit on main, makes the tag of the release, and makes the GitHub release with the offline archive of the site. The job pages then publishes the same build of the site.
#
# The schedule runs the step cut on the first day of each month. The repository variable M2_RELEASES turns the schedule on, so the off state is visible in the settings. With dry-run, the step cut makes no commit and no pull request, and the files of the release go into an artefact of the run.
on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:
    inputs:
      step:
        description: The step of the release.
        required: true
        type: choice
        options: [cut, tag]
        default: cut
      name:
        description: The name of the release, for example 2027.04. Empty means the month of today for the step cut, and the last release with no tag for the step tag.
        required: false
        type: string
      dry-run:
        description: Make no commit, no pull request and no tag.
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# With shell bash, a step fails when a command in a pipe fails.
defaults:
  run:
    shell: bash

jobs:
  cut:
    name: cut
    if: (github.event_name == 'schedule' && vars.M2_RELEASES == 'true') || (github.event_name == 'workflow_dispatch' && inputs.step == 'cut')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Push the branch release/NAME.
      contents: write
      # Open the pull request.
      pull-requests: write
      # Run the check workflow on the branch. A push with the workflow token does not start a workflow.
      actions: write
    outputs:
      name: ${{ steps.cut.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/m2
      - uses: ./.github/actions/lean
      - name: m2 release cut
        id: cut
        env:
          NAME: ${{ inputs.name }}
          DRY: ${{ inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          if [ "$DRY" = true ]; then args+=(-no-commit); fi
          if [ -n "$NAME" ]; then args+=("$NAME"); fi
          m2 release cut "${args[@]}" | tee "$RUNNER_TEMP/cut.txt"
          name=$(sed -n 's/^m2 release cut wrote the release \([0-9.]*\) of the commit .*/\1/p' "$RUNNER_TEMP/cut.txt")
          if [[ ! "$name" =~ ^[0-9]{4}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::The output of m2 release cut has no name of a release."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The job verify compares its rebuild with these .olean files, and in a dry run it reads the manifest from here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            manifests/releases/${{ steps.cut.outputs.name }}.*
            lean/.lake/build/lib/lean/**/*.olean
          if-no-files-found: error
          # The .olean files are under lean/.lake/.
          include-hidden-files: true
          retention-days: 7
      - name: open the pull request
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.cut.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "This cuts the release $NAME with m2 release cut. Before the merge:"
            echo
            echo "- [ ] Write the summary in \`manifests/releases/$NAME.md\`."
            echo "- [ ] Check that the job verify of the workflow release added the rebuild check to \`manifests/releases/$NAME.yaml\`. If a .olean file is different, write the reason into \`olean_differences\` (rule R02)."
            echo
            echo "After the merge, run the workflow release with the step tag. It runs the full audit on main and makes the tag."
          } > "$RUNNER_TEMP/body.md"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/release/$NAME"
          url=$(gh pr create --repo "$REPO" --base main --head "release/$NAME" --title "Cut the release $NAME" --body-file "$RUNNER_TEMP/body.md" --label "type: chore" --label "area: releases")
          echo "m2 release cut opened $url." >> "$GITHUB_STEP_SUMMARY"

  # A second machine rebuilds the release from its commit, as rule R02 needs. This job runs on a new runner, which has none of the files of the job cut.
  verify:
    name: verify
    needs: cut
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Push the rebuild check to the branch release/NAME.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/m2
      - uses: ./.github/actions/lean
      - name: check out the branch of the release
        if: inputs.dry-run != true
        env:
          NAME: ${{ needs.cut.outputs.name }}
        run: git switch -q "release/$NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: m2 release verify
        id: verify
        env:
          NAME: ${{ needs.cut.outputs.name }}
          DRY: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY" = true ]; then cp "$RUNNER_TEMP"/release/manifests/releases/"$NAME".* manifests/releases/; fi
          os=$(awk -F= '$1 == "ID" {id = $2} $1 == "VERSION_ID" {v = $2} END {gsub(/"/, "", v); print id "-" v}' /etc/os-release)
          runner="$os/$(uname -m)/$(nproc)c/$(( $(awk '/MemTotal/ {print $2}' /proc/meminfo) / 1048576 ))G"
          code=0
          m2 release verify -oleans "$RUNNER_TEMP/rebuild" -against "$RUNNER_TEMP/release/lean/.lake/build/lib/lean" -record "$runner" "$NAME" | tee "$RUNNER_TEMP/verify.txt" || code=$?
          {
            echo '```'
            cat "$RUNNER_TEMP/verify.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: push the rebuild check
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.cut.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Record the rebuild check of $NAME" -- "manifests/releases/$NAME.yaml"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/release/$NAME"
      - name: the result of the rebuild
        if: steps.verify.outputs.code != '0'
        run: |
          echo "::error::The rebuild did not reproduce each hash of the manifest. The summary of this run lists the different files."
          exit 1

  tag:
    name: tag
    if: github.event_name == 'workflow_dispatch' && inputs.step == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Push the tag and make the GitHub release.
      contents: write
    steps:
      # Rule T01 reads the git history, so the clone is not shallow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/m2
        id: m2
      - uses: ./.github/actions/lean
      - name: m2 build
        run: m2 build
      - name: m2 release cut
        id: tag
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          if [ -n "$NAME" ]; then args+=("$NAME"); fi
          m2 release cut "${args[@]}" | tee "$RUNNER_TEMP/tag.txt"
          name=$(sed -n 's/^m2 release cut made the tag \([0-9.]*\)\..*/\1/p' "$RUNNER_TEMP/tag.txt")
          if [[ ! "$name" =~ ^[0-9]{4}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::The output of m2 release cut has no name of a tag."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The site and the offline archive of the release come from one build of the site (spec 13.7). The spec pages come from the m2 version that CI uses. The date is the time of the commit, so a second build gives the same bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/math2-agent
          ref: ${{ steps.m2.outputs.version }}
          path: .toolchain
          sparse-checkout: spec
      - name: the site and the offline archive
        env:
          NAME: ${{ steps.tag.outputs.name }}
          URL: https://tamnd.github.io/math2
        run: |
          commit=$(git rev-parse "$NAME^{commit}")
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$commit")
          export SOURCE_DATE_EPOCH
          m2 site build -content . -spec .toolchain/spec -build build -out "$RUNNER_TEMP/site" -url "$URL" -commit "$commit"
          m2 site check -url "$URL" "$RUNNER_TEMP/site" | tee "$RUNNER_TEMP/site-check.txt"
          mkdir -p "$RUNNER_TEMP/archive"
          m2 site archive -url "$URL" -o "$RUNNER_TEMP/archive/math2-$NAME-site.zip" "$RUNNER_TEMP/site" | tee -a "$RUNNER_TEMP/site-check.txt"
          {
            echo '```'
            cat "$RUNNER_TEMP/site-check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # In a dry run, the archive goes into an artefact of the run, and Pages does not change.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.dry-run == true
        with:
          name: site-archive
          path: ${{ runner.temp }}/archive
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.dry-run != true
        with:
          path: ${{ runner.temp }}/site
      - name: push the tag
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "refs/tags/$NAME"
          gh release create "$NAME" --repo "$REPO" --verify-tag --title "math2 $NAME" --notes-file "manifests/releases/$NAME.md" "manifests/releases/$NAME.yaml" "manifests/releases/$NAME.levels" "$RUNNER_TEMP/archive/math2-$NAME-site.zip"

  # Pages shows the site of the release, the same build as the archive. The workflow pages builds main again after the next push or the next night.
  pages:
    name: publish the site of the release
    needs: tag
    if: inputs.dry-run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
