name: pages

# Build the wiki with m2 site build and publish it to https://tamnd.github.io/math2 and, when the secrets of Cloudflare are set, to https://math2.tamnd.com.
# The nightly run picks up changes to the toolchain and the spec in tamnd/math2-agent, and to the Wikipedia scope in tamnd/wikipedia-math.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a deploy that has started. Each run publishes the newest main.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: content
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/math2-agent
          ref: main
          path: toolchain
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/wikipedia-math
          ref: main
          path: wikipedia
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: toolchain/go.mod
          cache-dependency-path: toolchain/go.sum
      - name: build m2
        working-directory: toolchain
        run: go build -trimpath -o "$RUNNER_TEMP/m2" ./cmd/m2
      - uses: ./content/.github/actions/arxiv-records
        with:
          root: content
          m2: ${{ runner.temp }}/m2
      # The full catalogue of resources is in tamnd/math2-records at the commit of manifests/records.yaml (RS12.3). The site needs each resource, not only the tiers that math2 keeps.
      - name: add the full catalogue
        run: |
          commit=$(sed -n 's/^commit: //p' content/manifests/records.yaml 2>/dev/null || true)
          if [ -z "$commit" ]; then
            echo "no pin of the records"
            exit 0
          fi
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "the pin of the records is not a commit: $commit"
            exit 1
          fi
          git init -q records
          git -C records fetch -q --depth 1 https://github.com/tamnd/math2-records "$commit"
          git -C records checkout -q FETCH_HEAD
          "$RUNNER_TEMP/m2" res records unpack -root content -out records
      - name: build the site
        env:
          COMMIT: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/m2" site build -content content -spec toolchain/spec -wikipedia wikipedia -out _site -url https://tamnd.github.io/math2 -commit "$COMMIT" -date now
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: publish the wiki
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Build the wiki for https://math2.tamnd.com and publish it to Cloudflare Pages, as scripts/deploy-cloudflare.sh does on a build server. The job needs the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. When they are not set, the job builds the site and does not publish it.
  cloudflare:
    name: publish the wiki to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The site reads the dates of the changes to the nodes from the history, for the page Latest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: content
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/math2-agent
          ref: main
          path: toolchain
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/wikipedia-math
          ref: main
          path: wikipedia
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: toolchain/go.mod
          cache-dependency-path: toolchain/go.sum
      - name: build m2
        working-directory: toolchain
        run: go build -trimpath -o "$RUNNER_TEMP/m2" ./cmd/m2
      - uses: ./content/.github/actions/arxiv-records
        with:
          root: content
          m2: ${{ runner.temp }}/m2
      - name: build the site
        env:
          COMMIT: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/m2" site build -content content -spec toolchain/spec -wikipedia wikipedia -out _cloudflare -url https://math2.tamnd.com -commit "$COMMIT" -date now -cloudflare
      # Cloudflare Pages takes at most 20,000 files and 25 MiB for each file in one deployment.
      - name: check the limits of Cloudflare Pages
        run: |
          files=$(find _cloudflare -type f | wc -l)
          big=$(find _cloudflare -type f -size +24M | head -1)
          echo "the site has $files files"
          if [ "$files" -gt 19500 ] || [ -n "$big" ]; then
            echo "the site has more than 19500 files or a file over 24 MB ($big)"
            exit 1
          fi
      - name: publish
        env:
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so the site is not published to Cloudflare Pages"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy _cloudflare --project-name math2 --branch main --commit-hash "$COMMIT" --commit-message "math2 $COMMIT" --commit-dirty=true
