name: import

# Import the external sources and update the inventory (corpus spec K4 and K5). Each Monday the run downloads a new snapshot of each source, makes the records with m2 ingest, and adds the new mentions and rows with m2 corpus import. When the tree changes, the run opens a pull request and merges it. A merge with the workflow token does not start a workflow, so the run then starts the check and pages workflows.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      sources:
        description: The sources to import, with a space between two sources
        required: false
        type: string
        default: wikidata

permissions: {}

concurrency:
  group: import
  cancel-in-progress: false

# With shell bash, a step fails when a command in a pipe fails.
defaults:
  run:
    shell: bash

jobs:
  import:
    name: import the sources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Push the branch of the import and merge its pull request.
      contents: write
      pull-requests: write
      # Start the check and pages workflows.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: content
      # m2 corpus import is newer than the pinned release, so this run builds m2 from main, as the pages workflow does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/math2-agent
          ref: main
          path: toolchain
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: toolchain/go.mod
          cache-dependency-path: toolchain/go.sum
      - name: build m2
        working-directory: toolchain
        run: go build -trimpath -o "$RUNNER_TEMP/m2" ./cmd/m2
      - name: m2 ingest
        working-directory: content
        env:
          SOURCES: ${{ inputs.sources || 'wikidata' }}
        run: |
          for source in $SOURCES; do
            if [[ ! "$source" =~ ^[a-z0-9_]+$ ]]; then
              echo "::error::$source is not the id of a source"
              exit 1
            fi
            "$RUNNER_TEMP/m2" ingest -root . -cache "$RUNNER_TEMP/cache" "$source"
          done
      - name: m2 corpus import
        working-directory: content
        env:
          SOURCES: ${{ inputs.sources || 'wikidata' }}
        run: |
          # SOURCES has only ids that the step m2 ingest checked.
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/m2" corpus import -root . -commit "$GITHUB_SHA" $SOURCES | tee "$RUNNER_TEMP/import.txt"
          "$RUNNER_TEMP/m2" corpus status -root . > "$RUNNER_TEMP/status.txt"
      - name: open and merge the pull request
        working-directory: content
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The sources did not change. There is no pull request."
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          branch="import/$day-$RUN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -q -m "Import the sources of $day"
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" "HEAD:refs/heads/$branch"
          {
            echo "The import workflow made this pull request on $day. It ran m2 ingest and m2 corpus import on main."
            echo
            echo '```'
            cat "$RUNNER_TEMP/import.txt"
            echo
            cat "$RUNNER_TEMP/status.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          url=$(gh pr create -R "$REPO" --head "$branch" --base main --title "Import the sources of $day" --body-file "$RUNNER_TEMP/body.md" --label "area: inventory" --label "area: sources")
          gh pr merge "$url" --squash --delete-branch
          gh workflow run check.yml -R "$REPO" --ref main
          gh workflow run pages.yml -R "$REPO" --ref main
