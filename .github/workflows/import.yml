name: import

# Import the external sources and update the inventory (corpus spec K4, K5 and K12.1). Each Monday the run runs m2 corpus import with the plan corpus/plan.yaml: it downloads each source of the plan, makes the records, and adds the new mentions and rows. When the tree changes, the run opens a pull request with the summary of the import. A pull request or a merge with the workflow token does not start a workflow. Thus the run starts the check workflow on the branch, waits for it, merges the pull request when the checks pass, and then starts the pages workflow. When the checks fail, the pull request stays open with a comment.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: import
  cancel-in-progress: false

# With shell bash, a step fails when a command in a pipe fails.
defaults:
  run:
    shell: bash

jobs:
  import:
    name: import the sources
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      # Push the branch of the import and merge its pull request.
      contents: write
      pull-requests: write
      # Start the check and pages workflows.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: content
      # m2 corpus import is newer than the pinned release, so this run builds m2 from main, as the pages workflow does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/math2-agent
          ref: main
          path: toolchain
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: toolchain/go.mod
          cache-dependency-path: toolchain/go.sum
      - name: build m2
        working-directory: toolchain
        run: go build -trimpath -o "$RUNNER_TEMP/m2" ./cmd/m2
      - name: m2 corpus import
        working-directory: content
        run: |
          "$RUNNER_TEMP/m2" corpus import -plan corpus/plan.yaml -root . -commit "$GITHUB_SHA" -cache "$RUNNER_TEMP/cache" -summary "$RUNNER_TEMP/summary.md"
      - name: open and merge the pull request
        working-directory: content
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The sources did not change. There is no pull request."
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          branch="import/$day-$RUN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -q -m "Import the sources of $day"
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" "HEAD:refs/heads/$branch"
          {
            echo "The import workflow made this pull request on $day. It ran m2 corpus import with corpus/plan.yaml on main."
            echo
            cat "$RUNNER_TEMP/summary.md"
          } > "$RUNNER_TEMP/body.md"
          url=$(gh pr create -R "$REPO" --head "$branch" --base main --title "Import the sources of $day" --body-file "$RUNNER_TEMP/body.md" --label "area: inventory" --label "area: sources")
          sha=$(git rev-parse HEAD)
          # The required checks of main come from the check workflow. Start it on the branch and wait for it.
          gh workflow run check.yml -R "$REPO" --ref "$branch"
          run=""
          for _ in $(seq 30); do
            run=$(gh run list -R "$REPO" --workflow check.yml --branch "$branch" --event workflow_dispatch --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::The check workflow did not start on $branch. Pull request $url stays open."
            exit 1
          fi
          if ! gh run watch "$run" -R "$REPO" --exit-status --interval 30 > /dev/null; then
            gh pr comment "$url" -R "$REPO" --body "The checks failed in run $GITHUB_SERVER_URL/$REPO/actions/runs/$run. The pull request stays open for a person."
            echo "::error::The checks failed on $branch. Pull request $url stays open for a person."
            exit 1
          fi
          gh pr merge "$url" --squash --delete-branch
          gh workflow run pages.yml -R "$REPO" --ref main
