name: check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# No job in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # This check needs only Python. It works before the m2 toolchain has a release.
  nodes:
    name: node files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: install the Python packages
        run: pip install --disable-pip-version-check --require-hashes -r .github/scripts/requirements.txt
      - name: test the scripts and the macros
        run: python -m unittest discover -s .github/scripts
      - name: check that schema/edges.md is up to date
        run: python .github/scripts/gen_edges.py --check
      - name: check the node files
        run: python .github/scripts/check_nodes.py
      - name: check the curricula
        run: python .github/scripts/check_curricula.py
      - name: check the reviews
        run: python .github/scripts/check_reviews.py

  # A review is a statement by a person, thus each commit of a pull request that changes reviews/ must have a signature that GitHub verifies (reviews/README.md).
  signed:
    name: signed reviews
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: check the signatures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for sha in $(git rev-list "$BASE..$HEAD" -- reviews/); do
            verified=$(gh api "repos/$REPO/commits/$sha" --jq .commit.verification.verified)
            if [ "$verified" != true ]; then
              echo "::error::the commit $sha changes reviews/ and GitHub does not verify its signature"
              bad=1
            fi
          done
          exit "$bad"

  # Rule T03: no provisional id reaches main. This job fails on a pull request with a new node until a maintainer runs the mint workflow. It is a required check, so that the pull request cannot merge before then.
  tags:
    name: tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: install the Python packages
        run: pip install --disable-pip-version-check --require-hashes -r .github/scripts/requirements.txt
      - name: check that no provisional id is left
        run: python .github/scripts/check_nodes.py --no-provisional

  # Build the Math2 Lean package against the pinned Lean release and the pinned Mathlib tag.
  lean:
    name: lean build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
          build: true
          build-args: "--wfail"
          test: true
          lint: false
          leanchecker: true
          leanchecker-args: "Math2"
          axiom-audit: true
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"

  # Each file must have a licence. REUSE.toml gives the licence for each part of the tree.
  licences:
    name: reuse lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false

  # The full audit is in tamnd/math2-agent. The repository variable M2_READY turns this job on, so the off state is visible in the settings. It is true from M1. Do not set it back.
  audit:
    name: m2 audit
    if: vars.M2_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Rule T01 reads the git history, so the clone is not shallow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      # Pin m2 to a release, not to a branch. A push to the toolchain must not break this repository with no commit here. Move the pin as part of each m2 release.
      - name: install m2
        run: go install github.com/tamnd/math2-agent/cmd/m2@v0.1.9
      - name: m2 check
        run: m2 check
      # A pull request gets the audit of its changes. A push to main gets the full audit.
      - name: m2 audit
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            m2 audit -changed -base "origin/$BASE_REF"
          else
            m2 audit
          fi
