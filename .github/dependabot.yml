version: 2

updates:
  # Workflows pin each action to a commit SHA, with the tag in a comment. Dependabot changes the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "type: ci"
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"

  # The check script uses one package. The requirements file pins it with hashes.
  - package-ecosystem: pip
    directory: /.github/scripts
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels:
      - "type: chore"
      - "dependencies"
