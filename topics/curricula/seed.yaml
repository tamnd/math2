# The seed of math2: the concept skeleton of first and second year undergraduate mathematics (issue #7, spec 18.3 and 19 M1 in tamnd/math2-agent).
# The courses and the items are in teaching order. Each item has a kind and at least one source. The field decl is the Mathlib declaration that defines or states the item, at the pinned Mathlib commit. An item without decl has no declaration in Mathlib that matches it.
# The field mathlib lists the Mathlib lists that give the item with the same decl. The field node is the tag of the node for the item, when the node exists.
# The schema is schema/curriculum.v1.json. Check the file with: python .github/scripts/check_curricula.py
