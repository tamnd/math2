# The images of the computational engine (spec 08.1). images/flake.nix in tamnd/math2-agent builds each image, and its images workflow checks that two builds give the same digest. The digest of an image is the sha256 of its config, for each architecture. The digests come from the output of that workflow. These come from run 40237871283, with the images/flake.lock of tamnd/math2-agent#144, and run 40245567649 gave the same digests. An image with no digest is not built yet, and a computation cannot name it.
#
# A computation names an image as name@sha256:DIGEST, with the digest of one architecture. The digests of one entry are the same image on two architectures, and rule C02 compares the outputs of the two.
images:
